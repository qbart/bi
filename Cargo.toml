[package]
name = "bi"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
ropey = "1.6"
# crossterm is re-exported as `ratatui::crossterm` — depending on it directly
# invites a version skew that shows up as confusing trait mismatches.
ratatui = "0.29"
tree-sitter = "0.26.12"
tree-sitter-rust = "0.24.2"
streaming-iterator = "0.1.9"
# `toml_edit` rather than `toml`: it keeps byte spans after parsing, which is
# the difference between "unknown option" and "config.toml:7: unknown option".
toml_edit = "0.25.13"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-json = "0.24"
tree-sitter-ini = "1.4"
tree-sitter-md = "0.5"
tree-sitter-cmake = "0.7"

[profile.release]
lto = true
