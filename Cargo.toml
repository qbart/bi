[package]
name = "bi"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
ropey = "1.6"
# LSP speaks JSON-RPC; these two carry the wire format. The protocol structs
# are bi's own (src/lsp/types.rs), not the `lsp-types` crate — see
# docs/specs/lsp.md for why.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Display width in cells, not chars — a CJK char is two columns and a
# combining mark is none, and the cursor lands wrong without knowing that.
unicode-width = "0.2"
# crossterm is re-exported as `ratatui::crossterm` — depending on it directly
# invites a version skew that shows up as confusing trait mismatches.
ratatui = "0.29"
tree-sitter = "0.26.12"
tree-sitter-rust = "0.24.2"
streaming-iterator = "0.1.9"
# `toml_edit` rather than `toml`: it keeps byte spans after parsing, which is
# the difference between "unknown option" and "config.toml:7: unknown option".
toml_edit = "0.25.13"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-json = "0.24"
tree-sitter-ini = "1.4"
tree-sitter-md = "0.5"
tree-sitter-cmake = "0.7"
tree-sitter-go = "0.25.0"
tree-sitter-cpp = "0.23.4"
tree-sitter-c = "0.24.2"
tree-sitter-lua = "0.5.0"
tree-sitter-bash = "0.25.1"
tree-sitter-hcl = "1.1.0"
tree-sitter-css = "0.25.0"
tree-sitter-slang = "0.3.1"
tree-sitter-glsl = "0.2.0"
tree-sitter-hlsl = "0.2.0"
tree-sitter-python = "0.25.0"
arborium-dockerfile = "2.18.1"
# No crates.io release, so this one comes from git. Deliberate and
# permanent: bi is a library for its own frontends, not a crate for
# strangers, so `cargo publish` refusing a git dependency costs nothing.
# `rev` is pinned so `cargo update` cannot move it onto whatever is on
# their default branch that day.
# Crystal, likewise git-only. The crates.io `tree-sitter-crystal` is a
# different, toy grammar: 229 KB of parser against this one's 44 MB, and it
# puts twelve ERROR nodes through twenty-five lines of ordinary Crystal.
tree-sitter-crystal = { git = "https://github.com/crystal-lang-tools/tree-sitter-crystal", rev = "50ca9e6fcfb16a2cbcad59203cfd8ad650e25c49" }
tree-sitter-c3 = { git = "https://github.com/c3lang/tree-sitter-c3", rev = "1c6a95234c62130763ed1c479f958b74fdbfdb2a" }
tree-sitter-make = "1.1.1"
tree-sitter-ruby = "0.23.1"
tree-sitter-html = "0.23.2"
tree-sitter-scss = "1.0.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-swift = "0.7.3"
tree-sitter-java = "0.23.5"
tree-sitter-r = "1.3.0"
tree-sitter-julia = "0.23.1"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-templ = "2.2.0"
# Two grammars in one crate, and its build.rs compiles both whether or not
# either is referenced — so DTD costs nothing that XML has not already spent.
tree-sitter-xml = "0.7"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
ignore = "0.4.33"
imara-diff = "0.2.0"
# Image files open as images. Decoding is the core's — pixel dimensions are
# core facts, and every frontend wants the same RGBA — so the crate sits here
# rather than behind the terminal. Formats are named rather than defaulted:
# the default set drags in AVIF and EXR decoders nobody asked a text editor
# for. See docs/specs/images.md.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# The kitty graphics protocol carries pixels as base64. Terminal frontend only.
base64 = "0.22"

[profile.release]
lto = true
