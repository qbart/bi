[package]
name = "bi"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
ropey = "1.6"
# crossterm is re-exported as `ratatui::crossterm` — depending on it directly
# invites a version skew that shows up as confusing trait mismatches.
ratatui = "0.29"
tree-sitter = "0.26.12"
tree-sitter-rust = "0.24.2"
streaming-iterator = "0.1.9"
# `toml_edit` rather than `toml`: it keeps byte spans after parsing, which is
# the difference between "unknown option" and "config.toml:7: unknown option".
toml_edit = "0.25.13"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-json = "0.24"
tree-sitter-ini = "1.4"
tree-sitter-md = "0.5"
tree-sitter-cmake = "0.7"
tree-sitter-go = "0.25.0"
tree-sitter-cpp = "0.23.4"
tree-sitter-c = "0.24.2"
tree-sitter-lua = "0.5.0"
tree-sitter-bash = "0.25.1"
tree-sitter-hcl = "1.1.0"
tree-sitter-css = "0.25.0"
tree-sitter-slang = "0.3.1"
tree-sitter-glsl = "0.2.0"
tree-sitter-hlsl = "0.2.0"
tree-sitter-python = "0.25.0"
arborium-dockerfile = "2.18.1"
tree-sitter-c3 = { git = "https://github.com/c3lang/tree-sitter-c3", version = "0.8.2" }

[profile.release]
lto = true
