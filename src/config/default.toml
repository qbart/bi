# bi's defaults.
#
# Compiled into the binary. A user's config.toml is a PATCH over this file:
# anything they leave out keeps doing what this says, including settings added
# in later versions. See docs/specs/config.md.

[options]
number = 1
hlsearch = false

# Indentation. `tab_width` is how wide a \t is drawn, `shiftwidth` is how far
# `>` moves — 0 means "the same as tab_width", so one number usually does.
# `expandtab` writes indentation as spaces, which is not vim's default and is
# deliberate; a Makefile needs `:set expandtab false` until .editorconfig lands.
# `autoindent` starts a new line under the one above it.
# See docs/specs/indent.md.
tab_width = 4
shiftwidth = 0
expandtab = true
autoindent = true

# The column `gq` folds prose to. See docs/specs/reflow.md.
textwidth = 80

# A vertical line down each level of indentation. Its colour is the theme's
# `indent_guide`. See docs/specs/indent.md.
indent_guides = true

# The grammar to read a buffer with, overriding what its file name says —
# `:set syntax bash` for a script with no extension, `:set syntax auto` to hand
# the decision back. It changes what bi parses, not which [filetype.<name>]
# block applies: the file is still called what it is called.
syntax = "auto"

# Cells to the left of the line numbers, held for a mark about the line rather
# than in it — a git sign, a diagnostic, a breakpoint. Diagnostics and git
# signs both draw there now, the diagnostic winning the cell; the column is
# held open either way so the file does not shift sideways when the first
# mark of the session lands. 0 gives the cell back.
gutter = 1

# Every space as `·`, every tab as `→`, every newline as `¶`, and a
# non-breaking space as `␣` so it stops looking like a space. A debugging mode
# — `:whitespace` toggles it where you are, and it can be turned on for one
# kind of file with a [filetype.<name>] section. Its colour is the theme's
# `whitespace`.
whitespace = false

# TODO:, FIX:, HACK:, WARN:, PERF:, NOTE: and TEST: picked out of the text,
# wherever they appear — the colours are the theme's `todo_*` keys.
# See docs/specs/todo-comments.md.
todo_comments = true

# What the language server found wrong, drawn on the text: the range in the
# theme's `diag_*` colours, a sign in the gutter cell, and the message after
# the end of the cursor's line. Off hides the marks without forgetting them —
# `:lsp` still counts, and `]d` / `[d` still jump.
# See docs/specs/diagnostics.md.
diagnostics = true

# A sign in the gutter cell for every line the index does not have — added,
# changed, or with lines gone from under it — and a numstat (+3 ~1 -2) in the
# status row. Off hides both without forgetting them. The colours are the
# theme's `git_add`, `git_change` and `git_delete`.
# See docs/specs/git-signs.md.
git_signs = true

# #fb4934, rgb(251,73,52) and rgb(0.5f,0.1f,0.1) drawn in the colour they name,
# with black or white text over them — whichever can be read.
# See docs/specs/colors.md.
color_swatches = true

# The line that opened the block you are in, repeated after the line that
# closes it, as a comment in that language: `} // if (value == 0) {`. Virtual
# text, in the theme's `context` — nothing is added to the file.
#
# And when that opening line has scrolled off the top, it is drawn over the top
# row of the pane instead, in the theme's `context_header`.
#
# `context_depth` is how many enclosing blocks name themselves after their
# closing line, innermost first. `context_header_depth` is how many are drawn
# over the top of the pane, outermost first. 0 turns either off.
# `context_min_lines` is how many rows a block must span before it bothers — 1
# is any block that opens and closes on different rows.
# See docs/specs/tree-sitter-context.md.
context_depth = 1
context_header_depth = 1
context_min_lines = 1

# How long a yank stays lit, in milliseconds — 0 turns it off. `yy` is the one
# command whose whole effect is invisible. See docs/specs/flash.md.
yank_flash = 150

# Whether Ctrl-P skips what the project's .gitignore says are not its files —
# its own .git/info/exclude too, and the .gitignore files above it. Off lists
# everything again, which is how you reach a file the project ignores. Nothing
# else consults it: `:e` on an ignored path has always worked.
# See docs/specs/gitignore.md.
gitignore = true

# The palette. A name in themes/ beside this file wins, then a built-in of the
# same name, then this one. Built in: main, gruvbox-dark, gruvbox-light,
# pascal, ansi, vesper.
#
# `main` is the default: a near-black frame with cool accents, from IBM Carbon.
# `gruvbox-dark` was the default before it and is unchanged.
# `gruvbox-light` is that theme at the other end of its palette; it is not the
# default because bi cannot ask the terminal whether it is light.
# `pascal` is Borland Turbo Pascal 7, in the sixteen EGA colours.
# `ansi` is bi's pre-theme colours in the sixteen ANSI names, so it uses YOUR
# terminal palette and its background rather than bringing its own.
# `vesper` is near-black with one warm and one cool accent, after
# github.com/nexxeln/vesper.nvim.
# `gb` (or `gameboy`) is a Game Boy's screen — dark green on a cream LCD, one
# hue from end to end, with bold, italic and underline doing the work colour
# usually does. After the `mfd-paper` variant of github.com/kungfusheep/mfd.nvim.
# See docs/specs/theme.md.
theme = "main"

# The theme for a session that is editing from somewhere else — bi uses this
# instead of `theme` when SSH_CONNECTION is set. A second name rather than a
# switch, because the point is to tell the two apart at a glance: a window
# editing files on another machine should not look like one that is not.
# Set it to the same as `theme` to turn the distinction off.
ssh_theme = "gruvbox-light"

# What a write tidies up on its way out. `trim_on_write` is the master switch:
# off, none of the rest happens. `trim_first_line` removes blank lines at the
# top of the file and `trim_last_line` removes them at the bottom — a run of
# empty lines is the same accident at either end, and leaving it there means
# every write hands the reviewer a diff of nothing. `trim_final_newline` only
# ever adds one; removing the extra ones is `trim_last_line`'s job, which is
# why they are two settings and not one.
# Markdown keeps its trailing spaces: two of them are a hard line break there.
# See docs/specs/trim.md.
trim_on_write = true
trim_trailing = true
trim_first_line = true
trim_last_line = true
trim_final_newline = true

# A [filetype.<name>] section holds options for one kind of file, laid over
# [options] above — a [filetype.go] section setting tab_width to 4, say. The
# name is the one bi gives the file (rust, make, markdown, csharp), which is
# the same name its grammar is chosen by. bi has a built-in table of its own
# for what a language *requires*: a Makefile gets tabs eight columns wide, and
# Go gets tabs. A section here overrides that. See docs/specs/options.md.
#
# No example is written out below, unlike every other setting here: the lines
# in this file are meant to be uncommented where they stand, and a filetype
# option uncommented where it stands would land in [options] and mean
# something else.

# The other file: `:alt` (and `ga`) walks these in order and opens the first
# one that exists. `*` matches anything, separators included, and stands for
# the same text on the right — so `*_test.go` reads `internal/thing_test.go` as
# `internal/thing` and offers `internal/thing.go`. The first pattern that
# matches decides, which is why `*_test.go` is written before `*.go`.
# A pattern you set replaces bi's; anything else is added after it.
# See docs/specs/alternate.md.
[alternate]
"*_test.go" = ["*.go"]
"*.go" = ["*_test.go"]
"*.c" = ["*.h"]
"*.h" = ["*.c"]
"*.cpp" = ["*.hpp", "*.h"]
"*.hpp" = ["*.cpp", "*.cc"]
"*.cc" = ["*.hh", "*.hpp", "*.h"]
"*.hh" = ["*.cc", "*.cpp"]

# Language servers. Setting `enabled` to false turns the lot off. Each
# [lsp.servers.<name>] section below is one server: `command` is its argv,
# `filetypes` the files it claims (the same names [filetype.<name>] uses), and
# `roots` the files that mark a project's top — walked up from the file, with
# .git as the fallback. A server that is not installed costs nothing: bi tries
# it once per project, and `:lsp` says what happened. A section of yours
# patches the same-named one here field by field, so overriding `command`
# alone keeps the filetypes and roots; an `enabled` of false inside one turns
# off that server only. See docs/specs/lsp.md.
[lsp]
enabled = true

[lsp.servers.rust-analyzer]
command = ["rust-analyzer"]
filetypes = ["rust"]
roots = ["Cargo.toml"]

[lsp.servers.gopls]
command = ["gopls"]
filetypes = ["go"]
roots = ["go.work", "go.mod"]

[lsp.servers.clangd]
command = ["clangd"]
filetypes = ["c", "cpp"]
roots = ["compile_commands.json", ".clangd"]

[lsp.servers.pyright]
command = ["pyright-langserver", "--stdio"]
filetypes = ["python"]
roots = ["pyproject.toml", "setup.py", "requirements.txt"]

[lsp.servers.typescript-language-server]
command = ["typescript-language-server", "--stdio"]
filetypes = ["typescript", "tsx", "javascript"]
roots = ["tsconfig.json", "package.json"]

[lsp.servers.lua-language-server]
command = ["lua-language-server"]
filetypes = ["lua"]
roots = [".luarc.json"]

[lsp.servers.bash-language-server]
command = ["bash-language-server", "start"]
filetypes = ["bash"]
roots = []

[keys]
# The key <leader> stands for in a binding. Nothing uses it until you write a
# binding that spells it — and the moment one does, this key stops meaning
# whatever it meant on its own, because there is no timeout to decide between
# them.
leader = " "

# The rest of the keymap is still `match` arms in src/input.rs; only your
# overrides live in [keys.normal], [keys.visual] and [keys.tree].
