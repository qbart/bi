# forest — greens and teals on a near-black frame, with one warm accent kept
# for the things that are trying to get your attention. After
# https://github.com/lighthaus-theme/vim-lighthaus, read out of that project's
# `colors/lighthaus.vim` and `autoload/lightline/colorscheme/lighthaus.vim`.
#
# Compiled into the binary; a file at <config dir>/themes/forest.toml is a
# PATCH over this one, so changing a single colour does not mean copying the
# rest. `:set theme forest`, or `lighthaus`. See docs/specs/theme.md.
#
# THE NAME IS A CLAIM AND A TEST HOLDS IT TO ONE. Every colour that paints
# code here has more green in it than red; every colour that paints attention
# — a match, a flash, a jump label, the selection — has at least as much red
# as green. A green canopy, and warmth only where something wants looking at.
# A second test fences every value below to lighthaus's own palette:
#
#   black    #21252D   grey     #8E8D8D   non_text #373C45   bg       #18191E
#   red      #FC2929   red2     #FF5050   green    #44B273   green2   #50C16E
#   orange   #E25600   orange2  #ED722E   blue     #1D918B   blue2    #47A8A1
#   purple   #D16BB7   purple2  #D68EB2   cyan     #00BFA4   cyan2    #5AD1AA
#   white2   #CCCCCC   fg       #FFFADE   fg_alt   #FFEE79
#   hl_yellow #FFFF00  hl_orange #FF4D00  hl_bg    #090B26   gutter_bg #282c34

[syntax]
# The words that are the language rather than the program. lighthaus puts
# Keyword, Statement, Conditional, Repeat, Label and Operator on one cyan, and
# an operator sharing with a keyword is fine — what matters is that it is not
# the foreground, which is the failure docs/specs/tree-sitter.md names.
keyword     = "#5AD1AA"                              # cyan2
operator    = "#5AD1AA"
label       = "#5AD1AA"

function    = "#47A8A1"                              # blue2
constructor = "#47A8A1"
type        = "#47A8A1"
module      = "#47A8A1"
# The type colour, not lighthaus's `Tag` group — vim's `Tag` means "you can
# press CTRL-] on this", which is not what a tree-sitter `@tag` is. An element
# name names a kind of node, and gruvbox-dark reached the same place.
tag         = "#47A8A1"
boolean     = "#47A8A1"                              # source's own Boolean

string      = "#50C16E"                              # green2
character   = "#50C16E"
# The source's own SpecialChar: an escape interrupts the string it sits in,
# and the one warm colour lighthaus gives a name rather than a badge.
escape      = "#FFEE79"                              # fg_alt
# Constant is plain `Identifier` white in the source, which is the foreground
# — so it takes the escape's warm yellow instead, which lighthaus already
# spends on `goBuiltins`: a name the language hands you rather than one the
# program made up.
constant    = "#FFEE79"

# A DEPARTURE, and the same argument gruvbox-dark's orange operators make.
# lighthaus paints Comment in white2 #CCCCCC, one step off plain foreground,
# so prose reads at nearly the weight of the code explaining it. `grey` is the
# palette's own neutral — LineNr and jsonQuote already wear it and no syntax
# role does — so receding costs no new colour.
comment     = "#8E8D8D"                              # grey

number      = "#D68EB2"                              # purple2
float       = "#D68EB2"

# The key side of a config format, and the source has two answers for it:
# jsonKeyword is purple2 and yamlKey is purple. Purple, so a key does not come
# out the same colour as a number sitting next to it.
property                = "#D16BB7"                  # purple
# An attribute is a key with a value after it — `class="foo"` is the same
# shape as a YAML line — so it joins them rather than taking a colour of its
# own.
attribute               = "#D16BB7"
"string.special.key"    = "#D16BB7"
"string.special.symbol" = "#D16BB7"
# The source's own TSStringRegex. A pattern is not a literal, and the fallback
# walk would otherwise land it on `string`.
"string.special.regex"  = "#5AD1AA"                  # cyan2

# Brackets and separators, quiet on purpose and on every line. The source's
# own Delimiter.
punctuation = "#CCCCCC"                              # white2
delimiter   = "#CCCCCC"

# Markdown, whose captures are all text.* — markdownH1, markdownCode,
# markdownUrl and markdownUrlTitleDelimiter, in that order. The bold on the
# heading is added: it is the one place in prose where structure is content.
"text.title"     = { fg = "#1D918B", bold = true }   # blue
"text.literal"   = "#ED722E"                         # orange2
"text.uri"       = { fg = "#D16BB7", underline = true }
"text.reference" = "#00BFA4"                         # cyan

[ui]
background = "#18191E"
foreground = "#FFFADE"

cursorline = { bg = "#21252D" }                      # source's CursorLine
# The source's own Visual, and the one built-in here whose selection names a
# foreground: selecting a range repaints it rather than tinting what is under
# it. #090B26 is darker than the frame, so a selection reads as a hole cut in
# the page with the text glowing in it — the most recognisable thing about
# lighthaus on screen, and worth keeping over the house habit.
selection  = { fg = "#FF4D00", bg = "#090B26" }
# The source's own Search. Both halves, as theme.md requires.
search     = { fg = "#18191E", bg = "#E25600" }      # orange
# hl_orange, which is what lighthaus reaches for when it means "here": its
# MatchParen, its PmenuSel, its StartifySpecial.
flash      = { fg = "#18191E", bg = "#FF4D00" }
# hl_yellow, the source's FZF_pointer and StartifySelect — the colour it puts
# on the thing you are about to choose, which is exactly what a jump label is.
# It is also not `search`'s orange, which the letter must never be: `s` draws
# the two touching.
label      = { fg = "#18191E", bg = "#FFFF00", bold = true }
dim        = "#8E8D8D"                               # grey
# A second cursor is a block, and a block has to stay legible, so this one
# names both halves rather than tinting. Cyan is lightline's normal-mode
# colour — the cursor's own, in effect.
cursor_alt = { fg = "#18191E", bg = "#00BFA4" }

gutter         = "#8E8D8D"                           # source's LineNr
gutter_current = { fg = "#FFFF00", bg = "#21252D" }  # source's CursorLineNr
# non_text rather than the source's own answers for the next three, because
# lighthaus draws its split as a filled dark bar and its indent guides as
# filled columns, and bi draws both as a single `│` glyph. A colour picked to
# be a bar is either invisible or deafening as a glyph.
rule           = "#373C45"
indent_guide   = "#373C45"
filler         = "#373C45"                           # source's NonText
# The source has this at non_text too, and theme.md's rule wins: a mark you
# asked for and then have to squint at answers nothing. One step up, to grey.
whitespace     = "#8E8D8D"
# Furniture, and the quietest of it — gruvbox-dark's reading rather than
# main's, so it is a shape you notice when you go looking and not before.
context        = "#373C45"
# Chrome rather than furniture: it replaces a row of code, so it is the
# source's Pmenu — legible, and clearly not part of the file.
context_header = { fg = "#CCCCCC", bg = "#21252D" }

# Four of the five are lighthaus's own semantics — ErrorMsg, its own `Todo`,
# WarningMsg and AleInfo — and cyan finishes the set with the palette's calm
# accent. See docs/specs/todo-comments.md.
todo_fix   = { fg = "#18191E", bg = "#FF5050", bold = true }   # red2
todo_todo  = { fg = "#18191E", bg = "#FFEE79", bold = true }   # fg_alt, its Todo
todo_warn  = { fg = "#18191E", bg = "#ED722E", bold = true }   # orange2
todo_perf  = { fg = "#18191E", bg = "#D16BB7", bold = true }   # purple
todo_note  = { fg = "#18191E", bg = "#00BFA4", bold = true }   # cyan

# The four Coc groups, verbatim: CocErrorHighlight, CocWarningHighlight,
# CocInfoHighlight and CocHintSign. See docs/specs/diagnostics.md.
diag_error   = { fg = "#FF5050", underline = true }
diag_warning = { fg = "#ED722E", underline = true }
diag_info    = { fg = "#D68EB2", underline = true }
diag_hint    = { fg = "#FFEE79", underline = true }

# GitGutterAdd, GitGutterChange and GitGutterDelete, verbatim.
# See docs/specs/git-signs.md.
git_add      = "#44B273"                             # green
git_change   = "#FFFF00"                             # hl_yellow
git_delete   = "#FC2929"                             # red

# The float surface — hover, and the completion menu. The source's Pmenu.
popup = { fg = "#CCCCCC", bg = "#21252D" }

# lightline's normal, insert and visual rows, verbatim — bi's pick mode is
# the one that is choosing something, which is what visual is there.
mode_normal = { fg = "#21252D", bg = "#00BFA4", bold = true }
mode_insert = { fg = "#21252D", bg = "#50C16E", bold = true }
mode_pick   = { fg = "#21252D", bg = "#ED722E", bold = true }

status          = "#47A8A1"                          # source's StatusLine
status_muted    = "#8E8D8D"
status_inactive = { fg = "#CCCCCC", bg = "#21252D" } # source's StatusLineNC
statusline      = { fg = "#47A8A1", bg = "#21252D" }

tree_dir  = "#47A8A1"                                # source's NerdTreeDir
tree_link = "#00BFA4"                                # its NerdTreeDirSlash
mark_copy = "#50C16E"                                # green2, like an addition
mark_cut  = "#FC2929"                                # red, its FZF_marker

# The whole picker is lighthaus's fzf palette plus its PmenuSel, which is the
# nearest thing it has to bi's picker and was already themed.
picker_border   = "#1D918B"                          # FZF_border
picker_prompt   = "#50C16E"                          # FZF_prompt
picker_selected = { fg = "#FF4D00", bg = "#090B26", bold = true }  # PmenuSel
picker_badge    = "#D68EB2"                          # FZF_info
picker_divider  = "#373C45"
picker_preview  = "#CCCCCC"                          # white2, body text
