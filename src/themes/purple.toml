# purple — Shades of Purple: a deep indigo frame with high-saturation accents
# on top, and comments in violet rather than grey, which is the thing everyone
# remembers about it.
#
# Based on https://github.com/Rigellute/shades-of-purple.vim
#
# Compiled into the binary; a file at <config dir>/themes/purple.toml is a
# PATCH over this one. `:set theme purple`, or `shades-of-purple`.
# See docs/specs/theme.md.
#
# The compiled `colors/shades_of_purple.vim` hardcodes every hex, but the
# scheme is generated by Estilo from a named palette in
# `estilo/palettes/shades_of_purple.yml` — and that is what the comments below
# name, because `contrast` and `objectKeys` say what a colour is *for* in a
# way `#FAD000` never will.

[syntax]
keyword     = "#FF9D00"                              # keywords
operator    = "#FF9D00"                              # its own Operator
label       = "#9EFFFF"                              # other, its javaScriptLabel

# The generic `Function` group in the compiled file is the same orange as the
# keywords, which is Vim's fallback rather than the scheme's intent: every
# language-specific rule it ships — jsFuncName, jsFuncCall, jsArrowFunction,
# jsClassFuncName — paints a function `contrast` yellow. Taken, so that a call
# and a `return` are not the same colour.
function    = "#FAD000"                              # contrast
constructor = "#FB94FF"                              # definitions
type        = "#80FFBB"                              # objectKeys, its own Type
module      = "#9EFFFF"                              # other, its jsModuleKeyword
tag         = "#80FFBB"                              # its xmlTagName

string      = "#A5FF90"                              # strings
character   = "#9EFFFF"                              # its javaScriptCharacter
escape      = "#FF628C"                              # constants, its jsonEscape

# Violet, and the whole point of the theme. Every other built-in here recedes
# its comments into a grey; this one gives them a colour of their own and
# means it.
comment     = "#B362FF"                              # comment

constant    = "#FF628C"                              # constants
number      = "#FF628C"                              # its jsonNumber
float       = "#FF628C"
boolean     = "#FF628C"                              # its javaScriptBoolean

attribute   = "#FAD000"                              # contrast, its xmlAttrib

# The palette's one neutral. `Delimiter` is not set in the source, and the
# groups nearest to it — tsxTag, jsFuncArgs — are plain white, which is the
# foreground and therefore a capture that may as well not have fired.
punctuation = "#cad7e5"                              # grey
delimiter   = "#cad7e5"

property                = "#FFEE80"                  # contrastLite, its jsObjectProp
"string.special.key"    = "#FAD000"                  # contrast, its jsonKeyword
"string.special.symbol" = "#FAD000"
# stringsLite: a regex is a string-shaped thing set apart from one. The
# source's own javaScriptRegexpString is plain white, which is the failure
# above by another route.
"string.special.regex"  = "#d2ffc7"

"text.title"     = { fg = "#FAD000", bold = true }   # its htmlH1
"text.literal"   = "#75e44c"                         # templates
"text.uri"       = { fg = "#9EFFFF", underline = true }
"text.reference" = "#FB94FF"                         # definitions

[ui]
background = "#2D2B55"                               # background
foreground = "#E1EFFF"                               # white

cursorline = { bg = "#1E1E3F" }                      # backgroundDark
selection  = { bg = "#7d44b2" }                      # selectionBackground
# The source's `Search` is the same purple as the selection, so a match
# landing inside one disappears. Its `IncSearch` is not, and a search colour
# you cannot lose is worth more than the one it wrote down first.
search     = { fg = "#1E1E3F", bg = "#FFFF03" }      # searchHighlight
flash      = { fg = "#1E1E3F", bg = "#FF7200" }      # highlight, its own Todo
label      = { fg = "#1E1E3F", bg = "#FAD000", bold = true }  # contrast
# hoverBackground, which the palette defines and the scheme never spends —
# so a second cursor gets a colour of its own rather than borrowing one.
cursor_alt = { fg = "#E1EFFF", bg = "#4D21FC" }
dim        = "#A599E9"                               # foreground (the furniture one)

gutter         = "#A599E9"                           # its LineNr
gutter_current = { fg = "#E1EFFF", bold = true }     # its CursorLineNr
rule           = "#A599E9"                           # its VertSplit's own fg
filler         = "#A599E9"                           # its NonText
# One step quieter than the rest of the furniture, which is what an indent
# guide is: the thing you stop seeing.
indent_guide   = "#28284E"                           # gutter
whitespace     = "#A599E9"
context        = "#7d44b2"                           # selectionBackground
context_header = { fg = "#A599E9", bg = "#1F1F41" }  # menuBackground

popup = { fg = "#A599E9", bg = "#1F1F41" }           # its Pmenu

# `highlight` is the source's own `Todo`; the rest come from the palette's
# semantic names — `invalid` for the broken one, `contrast` for the warning.
# See docs/specs/todo-comments.md.
todo_fix   = { fg = "#1E1E3F", bg = "#EC3A37", bold = true }   # invalid
todo_warn  = { fg = "#1E1E3F", bg = "#FAD000", bold = true }   # contrast
todo_todo  = { fg = "#1E1E3F", bg = "#FF7200", bold = true }   # highlight
todo_perf  = { fg = "#1E1E3F", bg = "#FB94FF", bold = true }   # definitions
todo_note  = { fg = "#1E1E3F", bg = "#80FFBB", bold = true }   # objectKeys

diag_error   = { fg = "#EC3A37", underline = true }  # invalid, its own Error
diag_warning = { fg = "#FAD000", underline = true }  # its WarningMsg
diag_info    = { fg = "#9EFFFF", underline = true }  # other
diag_hint    = { fg = "#c991ff", underline = true }  # commentsLite

# diffAdded, its DiffChange, and diffRemoved — the source's own, pure
# primaries and all. See docs/specs/git-signs.md.
git_add      = "#00FF00"
git_change   = "#FF9D00"
git_delete   = "#FF000D"

# The lightline theme's normal, insert and visual rows.
mode_normal = { fg = "#1E1E3F", bg = "#A599E9", bold = true }
mode_insert = { fg = "#1E1E3F", bg = "#00FF00", bold = true }
mode_pick   = { fg = "#1E1E3F", bg = "#FB94FF", bold = true }

status          = "#E1EFFF"
status_muted    = "#A599E9"
status_inactive = { fg = "#A599E9", bg = "#1E1E3F" } # its StatusLineNC
# The source paints its own StatusLine the same purple as the frame, and a
# row meant to be seen cannot disappear into the one behind it — vesper's
# problem exactly. Lifted onto the darker surface, and told apart from an
# unfocused row by weight and a brighter foreground rather than by colour.
statusline      = { fg = "#E1EFFF", bg = "#1E1E3F", bold = true }

tree_dir  = "#9EFFFF"                                # other
tree_link = "#c991ff"                                # commentsLite
mark_copy = "#A5FF90"                                # strings
mark_cut  = "#FF628C"                                # constants

picker_border   = "#B362FF"                          # comment
picker_prompt   = "#FAD000"                          # contrast
picker_selected = { fg = "#9EFFFF", bg = "#2D2B55", bold = true }  # its PmenuSel
picker_badge    = "#A599E9"
picker_divider  = "#28284E"                          # gutter
picker_preview  = "#cad7e5"                          # grey
