# The sixteen ANSI names, which means YOUR terminal's palette rather than bi's
# idea of one.
#
# This is what bi looked like before it had themes, colour for colour, and that
# is its job: choosing a theme is not a one-way door, and `:set theme ansi`
# is the way back. It is also the test — if this file cannot say what
# tui/render.rs used to hardcode, the theme type is missing something. That is
# how `reverse` came to exist.
#
# It sets no `background` and no `foreground`, so the terminal's own show
# through. That is the point of naming `green` instead of `#b8bb26`: you asked
# for yours, and the background that was tuned alongside it comes too.

[syntax]
keyword     = "magenta"
function    = "blue"
constructor = "blue"
type        = "cyan"
module      = "cyan"

# `tag` is here and `string.special.symbol` deliberately is not, which is not
# an inconsistency. A symbol with no entry falls through to `string` and gets a
# colour — the one it got before themes existed, which is this file's whole
# promise. `tag` falls through to *nothing* and renders as plain foreground, and
# an XML document is almost entirely tags. There is also nothing to be faithful
# to: render.rs never had a `tag` arm, because HTML and XML both arrived after
# it stopped being the place colours lived.
tag         = "cyan"
string      = "green"
escape      = "green"
character   = "green"
comment     = "darkgray"
constant    = "yellow"
number      = "yellow"
float       = "yellow"
boolean     = "yellow"
attribute   = "lightmagenta"
label       = "lightmagenta"
operator    = "red"
punctuation = "gray"
delimiter   = "gray"

property             = "blue"
"string.special.key" = "blue"

"text.title"     = { fg = "blue", bold = true }
"text.literal"   = "green"
"text.uri"       = "cyan"
"text.reference" = "lightmagenta"

[ui]
# The 256-colour indices the old code used, kept rather than approximated
# because "exactly what it was" is the whole promise of this file. `search` is
# the one that had to move: `color58` was a background alone, and a match with
# no foreground of its own is a match wearing `dim`'s while `s` is aiming.
cursorline = { bg = "color236" }
selection  = { bg = "color239" }
search     = { fg = "black", bg = "yellow" }
cursor_alt = { bg = "magenta" }
flash      = { bg = "color58" }
# Yellow next door, the way gruvbox puts the label an orange away from the
# match: a letter that is the same colour as the thing it points at is a
# letter you cannot find.
label      = { fg = "black", bg = "lightred", bold = true }
dim        = "darkgray"

gutter         = "darkgray"
gutter_current = "yellow"
rule           = "darkgray"
filler         = "darkgray"
indent_guide   = "darkgray"

# TODO: and friends, in your terminal's own sixteen.
todo_fix   = { fg = "black", bg = "red", bold = true }
todo_todo  = { fg = "black", bg = "blue", bold = true }
todo_warn  = { fg = "black", bg = "yellow", bold = true }
todo_perf  = { fg = "black", bg = "magenta", bold = true }
todo_note  = { fg = "black", bg = "green", bold = true }

mode_normal = { fg = "black", bg = "blue", bold = true }
mode_insert = { fg = "black", bg = "green", bold = true }
mode_pick   = { fg = "black", bg = "magenta", bold = true }

status          = "cyan"
status_muted    = "darkgray"
status_inactive = "darkgray"
# Reverse video against the terminal's own colours, which is the focus
# indicator windows.md chose instead of borders.
statusline      = { reverse = true }

tree_dir  = "blue"
tree_link = "cyan"
mark_copy = "yellow"
mark_cut  = "red"

picker_border   = "magenta"
picker_prompt   = "magenta"
picker_selected = { fg = "magenta", bold = true }
picker_badge    = "darkgray"
picker_divider  = "darkgray"
picker_preview  = "gray"
